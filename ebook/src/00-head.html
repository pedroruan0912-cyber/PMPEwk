<title>Direitos Humanos PMPE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;600&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&display=swap">
<style>
/* Layout: sumário fixo à esquerda (gaveta no celular) + coluna de leitura de ~70ch, como um vade-mécum anotado com marca-texto */
:root{
  --paper:#F2F4F8; --surface:#FFFFFF; --ink:#131A26; --muted:#556072; --rule:#D3DAE4;
  --accent:#1B4F9C; --accent-ink:#FFFFFF; --accent-soft:#E2EBF9;
  --mark:#FFE45C; --mark-ink:#131A26;
  --trap:#B42318; --trap-soft:#FCEBE9;
  --ok:#1C6E45; --ok-soft:#E2F3E8;
  --law-bg:#EBF0F7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Literata",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0D121A; --surface:#141B26; --ink:#E4E8EF; --muted:#9AA5B6; --rule:#283245;
  --accent:#8AB0F2; --accent-ink:#0D121A; --accent-soft:#1A2943;
  --mark:#E6CB3F; --mark-ink:#131A26;
  --trap:#FF8F80; --trap-soft:#36191A;
  --ok:#72D29E; --ok-soft:#14301F;
  --law-bg:#18212F; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0D121A; --surface:#141B26; --ink:#E4E8EF; --muted:#9AA5B6; --rule:#283245;
  --accent:#8AB0F2; --accent-ink:#0D121A; --accent-soft:#1A2943;
  --mark:#E6CB3F; --mark-ink:#131A26;
  --trap:#FF8F80; --trap-soft:#36191A;
  --ok:#72D29E; --ok-soft:#14301F;
  --law-bg:#18212F; color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.62;font-optical-sizing:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
mark{background:var(--mark);color:var(--mark-ink);padding:0 .15em;border-radius:2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
button{font:inherit;color:inherit;cursor:pointer}

/* ---------- estrutura ---------- */
.app{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--rule);padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:16px;z-index:30}
.brand{font-family:var(--f-display);font-stretch:72%;font-weight:800;font-size:1.32rem;line-height:1.05;letter-spacing:.01em;text-transform:uppercase;margin:0 0 4px}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.68rem;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;margin-top:6px;font-stretch:100%}
.side nav{margin-top:18px;display:flex;flex-direction:column;gap:2px}
.nav-group{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.nav-link{display:grid;grid-template-columns:2.1em minmax(0,1fr) auto;align-items:baseline;gap:6px;padding:7px 8px;border-radius:6px;text-decoration:none;color:var(--ink);font-family:var(--f-display);font-size:.9rem;line-height:1.25}
.nav-link:hover{background:var(--accent-soft)}
.nav-link[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
.nav-num{font-family:var(--f-mono);font-size:.74rem;opacity:.75}
.nav-prog{font-family:var(--f-mono);font-size:.68rem;opacity:.8;font-variant-numeric:tabular-nums}
.main{min-width:0}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;background:var(--surface);border-bottom:1px solid var(--rule);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.topbar .where{font-family:var(--f-display);font-weight:700;font-stretch:80%;text-transform:uppercase;letter-spacing:.02em;font-size:.95rem;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.progress-mini{display:flex;align-items:center;gap:8px;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{width:90px;height:6px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0}
.icon-btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:6px 10px;font-family:var(--f-display);font-size:.82rem;font-weight:600}
.icon-btn:hover{border-color:var(--accent)}
.menu-btn{display:none}
.scrim{display:none}
.content{max-width:820px;margin:0 auto;padding-block:28px 80px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:920px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(86vw,330px);transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(20px + env(safe-area-inset-top,0px));box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:25}
  .menu-btn{display:inline-block}
  .progress-mini .bar{width:56px}
}

/* ---------- tipografia ---------- */
h1,h2,h3,h4{font-family:var(--f-display);text-wrap:balance;line-height:1.12;margin:0}
.ch-head{border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:8px}
.ch-kicker{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.ch-head h1{font-size:clamp(1.9rem,4.6vw,2.8rem);font-weight:800;font-stretch:70%;text-transform:uppercase;letter-spacing:.005em;margin-top:6px}
.ch-head .lede{margin:10px 0 0;color:var(--muted);font-style:italic;max-width:62ch}
.theory h2{font-size:1.45rem;font-weight:750;font-stretch:85%;margin:42px 0 12px;padding-top:12px;border-top:1px solid var(--rule)}
.theory h3{font-size:1.1rem;font-weight:700;margin:26px 0 8px}
.theory h4{font-size:.98rem;font-weight:700;margin:18px 0 6px}
.theory p{margin:0 0 14px;max-width:68ch}
.theory ul,.theory ol{margin:0 0 16px;padding-left:1.3em;max-width:68ch}
.theory li{margin:4px 0}
.theory li::marker{color:var(--muted)}
.ref{font-family:var(--f-mono);font-size:.84em;background:var(--law-bg);padding:.05em .35em;border-radius:3px;white-space:nowrap}

/* ---------- blocos ---------- */
.lei{background:var(--law-bg);border:1px solid var(--rule);border-radius:4px;padding:14px 16px;margin:14px 0 18px;max-width:72ch}
.lei .art{display:block;font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.lei p{margin:0 0 8px;font-size:.96rem}
.lei p:last-child{margin-bottom:0}
.trap{border:1.5px dashed var(--trap);background:var(--trap-soft);padding:12px 16px 12px;margin:16px 0 20px;max-width:72ch;border-radius:2px}
.trap-label,.tip-label{display:inline-block;font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--trap);margin-bottom:4px}
.trap p,.tip p{margin:0 0 8px}
.trap p:last-child,.tip p:last-child{margin-bottom:0}
.trap ul,.tip ul{margin:4px 0 0}
.tip{border:1px solid var(--rule);border-top:3px solid var(--accent);background:var(--surface);padding:12px 16px;margin:16px 0 20px;max-width:72ch}
.tip-label{color:var(--accent)}
.tbl-wrap{overflow-x:auto;margin:14px 0 20px;border:1px solid var(--rule);border-radius:4px;background:var(--surface)}
.tbl{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.45;min-width:520px}
.tbl th{font-family:var(--f-display);font-weight:700;text-align:left;background:var(--law-bg);border-bottom:1px solid var(--rule);padding:8px 10px;font-size:.84rem;letter-spacing:.01em}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--rule);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl:not(:has(th:nth-child(3))){min-width:0}
.tbl td:first-child{font-weight:600}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px;margin:14px 0 20px}
.cols>div{min-width:0;border:1px solid var(--rule);background:var(--surface);padding:12px 14px;border-radius:4px}
.cols h4{margin:0 0 6px;font-size:.95rem}
.cols p,.cols ul{font-size:.93rem;margin:0}
.cols ul{padding-left:1.1em}
.timeline{list-style:none;padding:0;margin:14px 0 20px;border-left:2px solid var(--rule)}
.timeline li{position:relative;padding:4px 0 10px 18px;margin:0}
.timeline li::before{content:"";position:absolute;left:-6px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.timeline b{font-family:var(--f-mono);font-weight:600;font-size:.84rem;color:var(--accent);margin-right:6px}
.ladder{display:flex;flex-direction:column;gap:6px;margin:16px 0 22px;max-width:620px}
.ladder div{border:1px solid var(--rule);background:var(--surface);padding:10px 14px;border-radius:4px;font-size:.93rem}
.ladder div:nth-child(1){margin-inline:0;background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.ladder div:nth-child(2){margin-inline:4%}
.ladder div:nth-child(3){margin-inline:8%}
.ladder div:nth-child(4){margin-inline:12%}
.ladder b{font-family:var(--f-display)}
details.deep{border:1px solid var(--rule);background:var(--surface);border-radius:4px;margin:12px 0 18px;max-width:72ch}
details.deep summary{cursor:pointer;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:.95rem}
details.deep>div{padding:0 14px 12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
.chip{font-family:var(--f-mono);font-size:.74rem;border:1px solid var(--rule);padding:3px 8px;border-radius:999px;background:var(--surface)}

/* ---------- abas do capítulo ---------- */
.ch-tabs{display:flex;gap:4px;margin:18px 0 6px;border-bottom:1px solid var(--rule)}
.ch-tab{border:0;background:transparent;padding:10px 14px;font-family:var(--f-display);font-weight:700;font-size:.92rem;border-bottom:3px solid transparent;margin-bottom:-1px;color:var(--muted)}
.ch-tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ch-foot{display:flex;justify-content:space-between;gap:10px;margin-top:48px;padding-top:16px;border-top:1px solid var(--rule);flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:9px 16px;font-family:var(--f-display);font-weight:700;font-size:.9rem;text-decoration:none}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ---------- questões ---------- */
.quiz-bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 8px}
.quiz-bar .seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.quiz-bar .seg button{border:0;background:var(--surface);padding:6px 11px;font-family:var(--f-display);font-size:.84rem;font-weight:600}
.quiz-bar .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.quiz-bar .count{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.q{background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;margin:14px 0}
.q-meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.04em;margin-bottom:8px}
.q-meta .qn{font-weight:600;color:var(--ink)}
.tag{border-radius:3px;padding:1px 7px;font-weight:600;letter-spacing:.08em;border:1px solid currentColor}
.tag.fcc{color:var(--accent)}
.tag.vunesp{color:var(--ok)}
.q-stem{margin:0 0 12px;font-size:.98rem}
.q-stem ol,.q-stem ul{margin:6px 0;padding-left:1.4em}
.q-stem p{margin:0 0 8px}
.q-opts{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;width:100%;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:9px 12px;font-family:var(--f-body);font-size:.94rem;line-height:1.45}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .lt{font-family:var(--f-mono);font-weight:600;font-size:.82rem;display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--rule);background:var(--surface)}
.opt[disabled]{cursor:default}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .lt{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .lt{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.wrong{border-color:var(--trap);background:var(--trap-soft)}
.opt.wrong .lt{background:var(--trap);color:var(--surface);border-color:var(--trap)}
.q-fb{margin-top:12px;border-top:1px dashed var(--rule);padding-top:10px}
.verdict{font-family:var(--f-display);font-weight:800;font-size:.95rem;margin:0 0 6px}
.verdict.ok{color:var(--ok)}
.verdict.no{color:var(--trap)}
.q-exp{font-size:.92rem;margin:0}
.q-exp p{margin:0 0 6px}
.q-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.small-btn{border:1px solid var(--rule);background:var(--surface);border-radius:5px;padding:5px 10px;font-family:var(--f-display);font-size:.8rem;font-weight:600}
.small-btn:hover{border-color:var(--accent)}
.empty{border:1px dashed var(--rule);padding:22px;text-align:center;color:var(--muted);border-radius:6px;font-style:italic}

/* ---------- capa ---------- */
.cover{padding-top:8px}
.cover .eyebrow{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cover h1{font-size:clamp(2.3rem,7vw,4.2rem);font-weight:800;font-stretch:66%;text-transform:uppercase;line-height:.95;margin:10px 0 14px;letter-spacing:-.005em}
.cover h1 mark{padding:0 .08em}
.cover .lede{font-size:1.06rem;max-width:62ch;margin:0 0 20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0 22px}
.stat{border:1px solid var(--rule);background:var(--surface);padding:12px 14px;border-radius:4px}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:800;font-stretch:75%;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0 26px}
.toc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px;margin:12px 0 26px}
.toc-card{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;text-decoration:none;color:var(--ink);border:1px solid var(--rule);background:var(--surface);padding:10px 12px;border-radius:4px}
.toc-card:hover{border-color:var(--accent)}
.toc-card .n{font-family:var(--f-mono);font-size:.8rem;color:var(--accent);font-weight:600;padding-top:2px}
.toc-card .t{font-family:var(--f-display);font-weight:700;font-size:.93rem;line-height:1.25}
.toc-card .s{display:block;font-family:var(--f-mono);font-size:.68rem;color:var(--muted);margin-top:4px;font-weight:400}
.banca-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:12px 0 20px}
.banca{border:1px solid var(--rule);background:var(--surface);padding:14px 16px;border-radius:4px;min-width:0}
.banca h3{font-size:1.15rem;margin-bottom:6px}
.banca ul{margin:0;padding-left:1.1em;font-size:.93rem}
.banca li{margin:3px 0}

/* ---------- simulado / flashcards ---------- */
.panel{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:16px 18px;margin:16px 0}
.panel h3{font-size:1.05rem;margin-bottom:10px}
.form-row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin:10px 0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
select{font:inherit;font-family:var(--f-display);font-size:.9rem;padding:7px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);max-width:100%}
.cap-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px 12px;margin:8px 0}
.cap-checks label{display:flex;gap:8px;align-items:flex-start;font-family:var(--f-display);font-size:.88rem;line-height:1.3;padding:3px 0}
.cap-checks input{margin-top:2px;accent-color:var(--accent)}
.sim-sticky{position:sticky;top:calc(env(safe-area-inset-top,0px) + 52px);z-index:10;display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--rule);border-radius:6px;padding:8px 12px;margin:12px 0;font-family:var(--f-mono);font-size:.78rem;font-variant-numeric:tabular-nums}
.sim-sticky .grow{flex:1}
.score{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.score-big{font-family:var(--f-display);font-weight:800;font-stretch:70%;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.score-note{margin:0;font-size:.95rem}
.fc-stage{perspective:1200px;margin:16px 0}
.fc{position:relative;min-height:240px;border:1px solid var(--rule);border-radius:8px;background:var(--surface);padding:26px 24px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;text-align:left;width:100%}
.fc .side-lbl{position:absolute;top:12px;left:16px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.fc.back{background:var(--accent-soft);border-color:var(--accent)}
.fc .fc-text{font-size:1.12rem;line-height:1.5}
.fc-nav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fc-nav .count{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px;font-size:.92rem}
.footer-note{font-size:.84rem;color:var(--muted);margin-top:30px;border-top:1px solid var(--rule);padding-top:12px}
</style>
